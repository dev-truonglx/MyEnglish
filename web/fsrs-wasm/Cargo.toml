[package]
name = "myenglish-fsrs-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "The desktop FSRS optimizer (src-tauri/src/fsrs_optimizer.rs) compiled to WebAssembly for the web version"

# Standalone: not part of any workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same version as the desktop app (src-tauri/Cargo.lock): same optimizer, same results
fsrs = "=6.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
