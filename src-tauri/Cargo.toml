[package]
name = "tauri-app"
version = "0.0.17"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.7.0"
arboard = "3.6.1"

# mac-notification-sys pulls in objc2 which only compiles on Apple platforms.
# Must be guarded so Windows cross-build (Linux Docker) doesn't try to compile it.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = false
